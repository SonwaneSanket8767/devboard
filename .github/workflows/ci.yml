#Goal : I have ton lint , build , test , code for 
#frontend and backend then push image to docker 

name: ci

on:
  push:
    branches:[advnaced]

jobs:
  frontend:
    steps:
      - name: checkout the code
        uses: actions/checkout@v7
      
      - name: frontend linter
        uses: action/setup-node@v6
          with:
          node-version: '22' # Or match your project's LTS version
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm package 
        uses: npm Install
        working-directory: frontend

      - name: Run linter
        run: npm run lint
        working-directory: frontend

      - name: Run test
        run: npm run test
        working-directory : frontend
        