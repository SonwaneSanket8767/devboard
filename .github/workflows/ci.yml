# Goal: lint, build and test frontend and backend, then push images to Docker

name: ci

on:
  push:
    branches: [advanced]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm packages
        run: npm ci
        working-directory: frontend

      - name: Run linter
        run: npm run lint
        working-directory: frontend

      - name: Run tests
        run: npm run test
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Docker login
        uses: docker/login-actions@v4
          with:
            username: ${{vars.Dockerhub_Usernme}}
            password: ${{vars.Dockerhub_Tocken}}

      - name: docker build and push
        uses: docker/nuild-push-action@v7
          with:
            push: true
            tags: ${{vars.Dockerhub_Usernme}}/devboard_fronted:latest
            context: ./frontend/dockerfile.multistage