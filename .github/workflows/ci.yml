name: CI

on:
  push:
    branches: [master]

jobs:
code-lint:
    runs-on: ubuntu-latest
    steps:
     - name:checkout code
       uses:actions/checkout@v7

     - name: Set up Node.js
       uses: actions/setup-node@v7
       with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint
       
  build-and-push:
    needs: [code-lint]
    name: Build & Push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Docker login
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/devboard-fe:latest
      
