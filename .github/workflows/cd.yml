# Goal: Deploy the images built by CI

name: CD

on:
  workflow_call:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Copy example env to main env
        run: cp .env.example .env

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Deploy containers with Docker Compose
        run: |
          docker compose pull
          docker compose up -d