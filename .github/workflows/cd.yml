# Goal: Deploy the images built by CI once the CI workflow succeeds

name: CD

on:
  workflow_run:
    workflows: ['ci']
    types: [completed]
    branches: [advanced]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted
    steps:
      - name: Code checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Copy example env to main env
        run: cp .env.example .env

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Deploy containers with Docker Compose
        run: |
          docker compose pull
          docker compose up -d